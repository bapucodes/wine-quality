# Red Wine Quality Prediction: Simple end-to-end MLOps pipeline

data:
  raw_path: data/raw/winequality.csv
  processed_dir: data/processed
  target_column: quality
  id_column: wine_id
  quality_threshold: 6

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 150
  max_depth: 12
  random_state: 42
  class_weight: balanced

mlflow:
  # Leave empty for local MLflow. For GitHub Actions, set the
  # MLFLOW_TRACKING_URI environment variable or put a server URI here.
  tracking_uri: ""
  experiment_name: wine_quality_model_training_lab7

registry:
  model_name: Wine_Quality_Production_Model
  decision_metric: recall

quality_gate:
  metric: recall
  minimum_value: 0.70

lab9:
  repetitions: 3

paths:
  preprocessor: models/preprocessor.pkl
  model: models/wine_quality_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  inference_output: outputs/inference_predictions.csv
